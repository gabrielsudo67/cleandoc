# Configuração do Streamlit — tema premium e limite de upload.

[server]
# Limite máximo aceito pelo servidor (MB). O limite por PLANO é aplicado no app.
maxUploadSize = 200
maxMessageSize = 200

[theme]
base = "dark"
primaryColor = "#c7ccd6"
backgroundColor = "#0a0a0b"
secondaryBackgroundColor = "#161719"
textColor = "#e8e9ec"
font = "sans serif"

[browser]
gatherUsageStats = false
